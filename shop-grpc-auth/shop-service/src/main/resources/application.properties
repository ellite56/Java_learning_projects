server.port=${SERVER_PORT:8080}
spring.application.name=schoolBE2
spring.docker.compose.enabled=${DOCKER_COMPOSE_ENABLED:false}
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/shop}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
springdoc.swagger-ui.path=/swagger/index.html
server.forward-headers-strategy=framework

spring.grpc.client.channel.auth.target=${AUTH_GRPC_TARGET:static://localhost:9090}
